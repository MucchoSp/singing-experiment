<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌唱実験 校正・録音</title><style>body{font-family:-apple-system,sans-serif;max-width:650px;margin:auto;padding:18px;line-height:1.6}label{display:block;margin-top:12px}select,input,button{font:inherit;padding:9px;max-width:100%}button{margin:10px 5px 0 0}#status{padding:10px;background:#eef2f7}audio{width:100%}small{color:#555}</style></head><body><h2>歌唱実験・校正テスト</h2><p>これは予備実験用です。録音とメタデータは端末内で一時保持し、共有操作で送信します。10 ms精度は未検証です。</p><label>匿名参加者ID <input id="pid" value="P01" maxlength="20"></label><label>端末・イヤホン識別メモ <input id="device" placeholder="例 iPhone 15 / USB-C有線イヤホン"></label><label>イヤホン種別 <select id="connection"><option value="wired">有線</option><option value="speaker-calibration">スピーカー（校正のみ）</option></select></label><label>モード <select id="mode"><option value="song">歌唱</option><option value="click">クリック間隔検査（iPhoneスピーカーで実施）</option></select></label><label>テンポ <select id="tempo"><option value="slow">遅い</option><option value="medium" selected>中間</option><option value="fast">速い</option></select></label><label>声量 <select id="loudness"><option value="soft">小</option><option value="medium" selected>中</option><option value="strong">大</option></select></label><p>試行番号：<strong id="trialNo">1</strong>（録音成功後に自動加算）</p><p><button id="start">録音＋再生開始</button><button id="stop" disabled>停止</button></p><p id="status">待機中</p><audio id="result" controls hidden></audio><p><button id="share" disabled>音声と記録を共有</button><button id="shareAudio" disabled>音声のみ共有</button><button id="shareMeta" disabled>記録のみ共有</button></p><p><button id="saveAudio" disabled>音声を保存</button><button id="saveMeta" disabled>記録を保存</button></p><small>共有先が複数ファイルを受け取れない場合は音声と記録を個別に共有してください。録音はページを閉じると失われます。クリック校正は厳密な入出力遅延校正ではありません。</small><script>
const $=id=>document.getElementById(id);let ctx,stream,rec,source,chunks=[],blob,meta,files=[];let trialNumber=1;const paths={slow:'audio/slow.mp3',medium:'audio/medium.mp3',fast:'audio/fast.mp3'};let stopRequested=false;
function note(s){$('status').textContent=s}function lock(v){$('start').disabled=v;$('stop').disabled=!v;for(const id of ['pid','device','connection','mode','tempo','loudness'])$(id).disabled=v}
async function cleanup(){try{source?.stop()}catch{}source=null;stream?.getTracks().forEach(t=>t.stop());stream=null;if(ctx&&ctx.state!=='closed')await ctx.close();ctx=null;lock(false)}
$('start').onclick=async()=>{lock(true);$('share').disabled=true;for(const id of ['shareAudio','shareMeta','saveAudio','saveMeta'])$(id).disabled=true;$('result').hidden=true;note('準備中…');stopRequested=false;try{const settings={pid:$('pid').value.trim()||'unknown',device:$('device').value.trim(),connection:$('connection').value,mode:$('mode').value,trialNumber,tempo:$('tempo').value,loudness:$('loudness').value};ctx=new AudioContext();await ctx.resume();let buffer;if(settings.mode==='song'){const r=await fetch(paths[settings.tempo]);if(!r.ok)throw Error('伴奏が見つかりません');buffer=await ctx.decodeAudioData(await r.arrayBuffer())}else{const sr=ctx.sampleRate,duration=5;buffer=ctx.createBuffer(1,Math.ceil(sr*duration),sr);const a=buffer.getChannelData(0);for(let sec=1;sec<5;sec++){const at=Math.floor(sec*sr);for(let j=0;j<Math.floor(sr*.012);j++){a[at+j]+=Math.sin(2*Math.PI*1800*j/sr)*Math.exp(-j/(sr*.002))*.35}}}
stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const track=stream.getAudioTracks()[0];const mime=['audio/mp4','audio/webm;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];meta={...settings,trialId:crypto.randomUUID(),wallClockISO:new Date().toISOString(),audioContextSampleRate:ctx.sampleRate,trackSettings:track.getSettings(),scheduledStartContextSeconds:null,recorderStartPerformanceMs:null,recorderStopPerformanceMs:null,format:null,warning:'再生予定時刻は実際のイヤホン出力時刻や収音時刻を示さない。10ms同期保証なし。'};rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{blob=new Blob(chunks,{type:rec.mimeType||'application/octet-stream'});meta.format=blob.type;meta.sizeBytes=blob.size;const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('webm')?'webm':'bin';const name=`${meta.pid}_${meta.tempo}_${meta.loudness}_${meta.trialId.slice(0,8)}`;files=[new File([blob],name+'.'+ext,{type:blob.type}),new File([JSON.stringify(meta,null,2)],name+'.json',{type:'application/json'})];$('result').src=URL.createObjectURL(blob);$('result').hidden=false;$('share').disabled=false;for(const id of ['shareAudio','shareMeta','saveAudio','saveMeta'])$(id).disabled=false;trialNumber++;$('trialNo').textContent=trialNumber;note('録音完了。音声と記録を共有できます。');await cleanup()};rec.start();meta.recorderStartPerformanceMs=performance.now();source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);meta.scheduledStartContextSeconds=ctx.currentTime+.5;source.onended=()=>{if(!stopRequested)finish()};source.start(meta.scheduledStartContextSeconds);note('録音中・再生中');}catch(e){note('エラー：'+e.message);await cleanup()}};
async function shareOne(index){if(!files[index])return;if(!navigator.share||!navigator.canShare?.({files:[files[index]]})){note('この端末ではファイル共有に対応していません。保存ボタンをお試しください。');return}try{await navigator.share({files:[files[index]],title:index===0?'歌唱実験 音声':'歌唱実験 記録'});note('共有操作を終了しました。受信先を確認してください。')}catch(e){note(e.name==='AbortError'?'共有をキャンセルしました':'共有エラー：'+e.message)}}function saveOne(index){if(!files[index])return;const u=URL.createObjectURL(files[index]);const a=document.createElement('a');a.href=u;a.download=files[index].name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('shareAudio').onclick=()=>shareOne(0);$('shareMeta').onclick=()=>shareOne(1);$('saveAudio').onclick=()=>saveOne(0);$('saveMeta').onclick=()=>saveOne(1);function finish(){if(!rec||rec.state==='inactive')return;stopRequested=true;meta.recorderStopPerformanceMs=performance.now();rec.stop();$('stop').disabled=true;note('録音を処理中…')}$('stop').onclick=()=>{try{source?.stop()}catch{}finish()};$('share').onclick=async()=>{if(!files.length)return;if(navigator.canShare?.({files})&&navigator.share){try{await navigator.share({files,title:'歌唱実験（音声・記録）'});note('共有操作を終了しました。送信先で受信を確認してください。');return}catch(e){if(e.name==='AbortError'){note('共有をキャンセルしました');return}}}if(navigator.canShare?.({files:[files[0]]})&&navigator.share){try{await navigator.share({files:[files[0]],title:'歌唱実験 音声'});note('音声を共有しました。JSON記録は別途共有が必要です。');return}catch(e){note('共有できませんでした：'+e.message);return}}note('この端末ではファイル共有に対応していません。')};
</script></body></html>
